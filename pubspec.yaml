name: app
description: "Campus financial super-app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # GraphQL
  graphql_flutter: ^5.2.0

  # Local DB (offline-first)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.0

  # Auth & Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  jwt_decoder: ^2.0.1

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # UI & Animations
  lottie: ^3.1.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Utils
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.14.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  speech_to_text: ^7.0.0
  decimal: ^3.0.2
  flutter_bloc: ^9.1.1
  genui: ^0.9.0
  json_schema_builder: ^0.1.3
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.6.0
  flutter_windowmanager: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  flutter_lints: ^4.0.0
  drift_dev: ^2.28.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.otf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

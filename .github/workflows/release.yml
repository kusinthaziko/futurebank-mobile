name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APKs and create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode keystore
        if: ${{ secrets.FB_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.FB_KEYSTORE_BASE64 }}" | base64 -d > android/key.jks

      - name: Build universal APK
        run: flutter build apk --release
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Build app bundle
        run: flutter build appbundle --release
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: List artifacts
        run: |
          echo "=== APKs ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: futureBank ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## futureBank ${{ github.ref_name }}

            ### APKs
            - **universal.apk** — single APK for all architectures (larger)
            - **arm64-v8a.apk** — 64-bit ARM (modern phones, ~90% of devices)
            - **armeabi-v7a.apk** — 32-bit ARM (older phones)
            - **x86_64.apk** — x86 emulators and Chromebooks

            ### App Bundle
            - **app-release.aab** — for Google Play Store submission

            ### Checksums
            SHA-256 hashes of all artifacts are included below.
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: false

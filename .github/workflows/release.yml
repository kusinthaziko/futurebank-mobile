name: Build & Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  release:
    name: Auto-tag, build, and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from pubspec
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Decode keystore
        if: ${{ secrets.FB_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.FB_KEYSTORE_BASE64 }}" | base64 -d > android/key.jks

      - name: Build universal APK
        run: flutter build apk --release
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Build app bundle
        run: flutter build appbundle --release
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: List artifacts
        run: |
          echo "=== APKs ==="
          ls -lh build/app/outputs/flutter-apk/
          echo "=== AAB ==="
          ls -lh build/app/outputs/bundle/release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: futureBank ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            ## futureBank ${{ steps.version.outputs.tag }}

            ### Artifacts
            | File | Type |
            |------|------|
            | `app-universal-release.apk` | Universal (all architectures) |
            | `app-arm64-v8a-release.apk` | 64-bit ARM (modern phones) |
            | `app-armeabi-v7a-release.apk` | 32-bit ARM (older phones) |
            | `app-x86_64-release.apk` | Emulators / Chromebooks |
            | `app-release.aab` | Google Play Store bundle |

            ### Changelog
            See the commit history for details.
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          generate_release_notes: true

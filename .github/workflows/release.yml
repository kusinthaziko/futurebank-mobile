name: Build & Release

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - run: flutter pub get
      - run: flutter test

  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ')
          echo "tag=v$VER+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-apk-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FB_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/key.jks

      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_URL=https://futurebank-api.onrender.com/api/graphql \
            --dart-define=WS_URL=wss://futurebank-api.onrender.com/socket/websocket
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  build-aab:
    name: Build AAB
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-aab-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-aab-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FB_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/key.jks

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=https://futurebank-api.onrender.com/api/graphql \
            --dart-define=WS_URL=wss://futurebank-api.onrender.com/socket/websocket
        env:
          FB_KEYSTORE_PATH: ${{ secrets.FB_KEYSTORE_PATH || '' }}
          FB_KEYSTORE_PASSWORD: ${{ secrets.FB_KEYSTORE_PASSWORD || '' }}
          FB_KEY_ALIAS: ${{ secrets.FB_KEY_ALIAS || '' }}
          FB_KEY_PASSWORD: ${{ secrets.FB_KEY_PASSWORD || '' }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-apk, build-aab]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ')
          echo "tag=v$VER+build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: apks
          path: artifacts/apks

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: aab
          path: artifacts/aab

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: futureBank ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body: |
            ## futureBank ${{ steps.version.outputs.tag }}

            | File | Type |
            |------|------|
            | `app-arm64-v8a-release.apk` | 64-bit ARM (modern phones) |
            | `app-armeabi-v7a-release.apk` | 32-bit ARM (older phones) |
            | `app-x86_64-release.apk` | Emulators / Chromebooks |
            | `app-release.aab` | Google Play Store bundle |
          files: |
            artifacts/apks/*.apk
            artifacts/aab/*.aab
          generate_release_notes: true
